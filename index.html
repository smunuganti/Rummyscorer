<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    
    <!-- App Meta Tags for iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Diwali Rummy">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2b0404">
    
    <!-- Diwali Icons -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%232b0404%22/><text y=%22.9em%22 font-size=%2280%22 x=%2210%22>🪔</text></svg>">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪔</text></svg>">

    <title>Rummy Scorer - Royal Diwali Edition</title>
    
    <!-- Core Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Canvas Library for Screenshots & Fireworks -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* DIWALI FESTIVE ANIMATIONS & THEME STYLING */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

        :root {
            --font-serif: 'Cinzel', serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", 'Plus Jakarta Sans', sans-serif;
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
        }

        @keyframes diya-flame-flicker {
            0%, 100% { transform: scale(1) rotate(-1deg); filter: drop-shadow(0 0 12px rgba(251, 191, 36, 0.9)) drop-shadow(0 0 25px rgba(245, 158, 11, 0.7)); }
            25% { transform: scale(1.08, 0.95) rotate(1deg); filter: drop-shadow(0 0 15px rgba(251, 191, 36, 1)) drop-shadow(0 0 35px rgba(239, 68, 68, 0.8)); }
            50% { transform: scale(0.96, 1.06) rotate(-2deg); filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.8)) drop-shadow(0 0 20px rgba(251, 191, 36, 0.6)); }
            75% { transform: scale(1.04, 1.02) rotate(2deg); filter: drop-shadow(0 0 18px rgba(251, 191, 36, 0.95)) drop-shadow(0 0 30px rgba(245, 158, 11, 0.75)); }
        }

        @keyframes floating-petal {
            0% { transform: translateY(-10vh) rotate(0deg) translateX(0px); opacity: 0; }
            10% { opacity: var(--item-opacity); }
            90% { opacity: var(--item-opacity); }
            100% { transform: translateY(110vh) rotate(540deg) translateX(60px); opacity: 0; }
        }

        @keyframes rangoli-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes soft-glow-pulse {
            0%, 100% { opacity: 0.35; transform: scale(1); filter: blur(60px); }
            50% { opacity: 0.65; transform: scale(1.15); filter: blur(80px); }
        }

        @keyframes festive-bg-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes gold-shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .animate-flame {
            animation: diya-flame-flicker 2.5s ease-in-out infinite;
            transform-origin: bottom center;
            will-change: transform, filter;
        }

        .animate-petal {
            animation: floating-petal linear infinite;
            will-change: transform, opacity;
        }

        .animate-rangoli {
            animation: rangoli-spin 90s linear infinite;
            will-change: transform;
        }

        .animate-festive-glow {
            animation: soft-glow-pulse 6s ease-in-out infinite;
            will-change: transform, opacity;
        }

        /* Festive Background Themes */
        .diwali-bg-dark {
            background: linear-gradient(135deg, #1c0202, #3b070c, #4a0e17, #26050a, #1a0104);
            background-size: 300% 300%;
            animation: festive-bg-shift 20s ease infinite;
            will-change: background-position;
        }

        .diwali-bg-light {
            background: linear-gradient(135deg, #fffbeb, #fef3c7, #fde68a, #fff7ed, #fffbeb);
            background-size: 300% 300%;
            animation: festive-bg-shift 20s ease infinite;
            will-change: background-position;
        }

        /* Glassmorphism & Gold Effects */
        .royal-glass-dark {
            background: rgba(43, 4, 4, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(245, 158, 11, 0.3);
            box-shadow: 0 12px 36px -5px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(254, 243, 199, 0.2);
        }

        .royal-glass-light {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(217, 119, 6, 0.3);
            box-shadow: 0 12px 36px -5px rgba(180, 83, 9, 0.15), inset 0 1px 1px rgba(255, 255, 255, 0.9);
        }

        .gold-shimmer-text {
            background: linear-gradient(90deg, #f59e0b, #fef08a, #d97706, #fef08a, #f59e0b);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: gold-shimmer 4s linear infinite;
        }

        .font-serif-royal { font-family: var(--font-serif); }
        .font-sans-royal { font-family: var(--font-sans); }

        ::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        html, body {
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            font-family: var(--font-sans);
            user-select: none;
            -webkit-user-select: none;
            height: 100dvh;
            width: 100vw;
            background-color: #2b0404;
            transition: background-color 0.5s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overscroll-behavior: none;
        }

        input { 
            user-select: text;
            -webkit-user-select: text;
        }

        /* Safe area helpers tuned for iOS Notch / Dynamic Island */
        .pt-ios-safe { padding-top: max(12px, var(--sat)); }
        .pb-ios-safe { padding-bottom: max(16px, var(--sab)); }
        .px-ios-safe { padding-left: max(16px, var(--sal)); padding-right: max(16px, var(--sar)); }

        /* Player Inactive & Eliminative Styles */
        .player-inactive {
            filter: grayscale(0.85) opacity(0.35) !important;
            pointer-events: none;
        }
        .total-inactive {
            text-decoration: line-through;
            opacity: 0.4;
        }
    </style>
</head>
<body id="app-body">
    <div id="root"></div>

    <script>
        // Configure Babel standalone to compile JSX cleanly to React.createElement
        Babel.registerPreset('classic-react', {
            presets: [
                [Babel.availablePresets['react'], { runtime: 'classic' }]
            ]
        });
    </script>

    <script type="text/babel" data-presets="classic-react">
        const { useState, useEffect, useRef, useMemo } = React;

        // Custom Festive SVG Icon Component
        const Icon = React.memo(({ name, size = 20, className = "" }) => {
            const icons = {
                "diya": (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" className={className}>
                        <path d="M12 2C12 2 14.5 5.5 14.5 7.5C14.5 9 13.5 10 12 10C10.5 10 9.5 9 9.5 7.5C9.5 5.5 12 2 12 2Z" fill="url(#flame-grad)"/>
                        <path d="M4 14C4 17.866 7.58172 21 12 21C16.4183 21 20 17.866 20 14C20 13.5 19.5 12.5 17 12.5C14 12.5 13.5 13.5 12 13.5C10.5 13.5 10 12.5 7 12.5C4.5 12.5 4 13.5 4 14Z" fill="currentColor"/>
                        <defs>
                            <linearGradient id="flame-grad" x1="12" y1="2" x2="12" y2="10" gradientUnits="userSpaceOnUse">
                                <stop stopColor="#FEF08A"/>
                                <stop offset="0.5" stopColor="#F97316"/>
                                <stop offset="1" stopColor="#EF4444"/>
                            </linearGradient>
                        </defs>
                    </svg>
                ),
                "sparkles": (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
                        <path d="M5 3v4"/>
                        <path d="M19 17v4"/>
                        <path d="M3 5h4"/>
                        <path d="M17 19h4"/>
                    </svg>
                ),
                "crown": (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/>
                    </svg>
                ),
                "rangoli": (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" className={className}>
                        <circle cx="12" cy="12" r="9"/>
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 3v18M3 12h18M5.636 5.636l12.728 12.728M5.636 18.364L18.364 5.636"/>
                    </svg>
                ),
                "plus": (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                ),
                "pencil-line": (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M12 20h9"/>
                        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                        <path d="m15 5 3 3"/>
                    </svg>
                ),
                "camera": (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
                        <circle cx="12" cy="13" r="3"/>
                    </svg>
                ),
                "rotate-ccw": (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                ),
                "history": (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                        <circle cx="12" cy="12" r="1"/>
                        <polyline points="12 7 12 12 15 15"/>
                    </svg>
                ),
                "settings-2": (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M20 7h-9"/>
                        <path d="M14 17H5"/>
                        <circle cx="17" cy="17" r="3"/>
                        <circle cx="7" cy="7" r="3"/>
                    </svg>
                ),
                "users": (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                ),
                "lock": (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                ),
                "x": (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                ),
                "user-minus": (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <line x1="22" y1="11" x2="16" y2="11"/>
                    </svg>
                ),
                "sun": (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                    </svg>
                ),
                "moon": (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                    </svg>
                ),
                "alert-triangle": (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
                        <line x1="12" y1="9" x2="12" y2="13"/>
                        <line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                ),
                "check-circle-2": (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
                        <path d="m9 12 2 2 4-4"/>
                    </svg>
                ),
                "pencil": (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
                    </svg>
                ),
                "loader-2": (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={`animate-spin ${className}`}>
                        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                    </svg>
                )
            };
            return icons[name] || (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
                    <circle cx="12" cy="12" r="10"/>
                </svg>
            );
        });

        const STORAGE_KEY = "rummy_scorer_diwali_prod_v1";
        const THEME_KEY = "rummy_scorer_theme_pref_diwali";
        const DEFAULT_ROSTER = ['Player 1', 'Player 2', 'Player 3'];

        // --- Ambient Diwali Visuals ---

        const FloatingPetalsAndSparkles = React.memo(({ isDarkMode }) => {
            const elements = useMemo(() => {
                return Array.from({ length: 30 }).map((_, i) => ({
                    id: i,
                    left: Math.random() * 100,
                    opacity: 0.2 + Math.random() * 0.6,
                    duration: 6 + Math.random() * 8,
                    delay: Math.random() * 5,
                    size: 14 + Math.random() * 16,
                    type: i % 3 === 0 ? "diya" : i % 3 === 1 ? "sparkles" : "rangoli"
                }));
            }, []);

            return (
                <div className="fixed inset-0 pointer-events-none overflow-hidden z-10 opacity-40">
                    {elements.map(item => (
                        <div key={item.id} className="absolute animate-petal" style={{ 
                            left: `${item.left}%`, 
                            top: '-40px',
                            color: item.type === "diya" ? "#f59e0b" : item.type === "sparkles" ? "#fef08a" : "#ef4444",
                            '--item-opacity': item.opacity,
                            animationDuration: `${item.duration}s`, 
                            animationDelay: `${item.delay}s` 
                        }}>
                            <Icon name={item.type} size={item.size} />
                        </div>
                    ))}
                </div>
            );
        });

        const RangoliBackground = React.memo(({ isDarkMode }) => {
            return (
                <div className="fixed inset-0 pointer-events-none overflow-hidden z-0 opacity-15 flex items-center justify-center">
                    <div className={`w-[140vw] h-[140vw] max-w-[800px] max-h-[800px] animate-rangoli ${isDarkMode ? 'text-amber-400' : 'text-amber-700'}`}>
                        <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" className="w-full h-full">
                            <circle cx="100" cy="100" r="96" strokeWidth="0.5" strokeDasharray="3 3" />
                            <circle cx="100" cy="100" r="80" strokeWidth="0.75" />
                            <circle cx="100" cy="100" r="60" strokeWidth="0.5" strokeDasharray="2 4" />
                            <circle cx="100" cy="100" r="40" strokeWidth="1" />
                            <path d="M100 4 L100 196 M4 100 L196 100 M32.19 32.19 L167.81 167.81 M32.19 167.81 L167.81 32.19" strokeWidth="0.5" opacity="0.6"/>
                            {Array.from({ length: 12 }).map((_, idx) => (
                                <g key={idx} transform={`rotate(${idx * 30} 100 100)`}>
                                    <path d="M100 20 C108 35 108 45 100 60 C92 45 92 35 100 20 Z" strokeWidth="0.8" fill="none"/>
                                </g>
                            ))}
                        </svg>
                    </div>
                </div>
            );
        });

        const CelebrationFireworks = React.memo(({ active }) => {
            if (!active) return null;
            return (
                <div className="fixed inset-0 pointer-events-none z-50 overflow-hidden">
                    <div className="absolute top-1/4 left-1/4 w-32 h-32 bg-amber-400/30 rounded-full blur-xl animate-ping"></div>
                    <div className="absolute top-1/3 right-1/4 w-40 h-40 bg-yellow-300/30 rounded-full blur-xl animate-ping delay-300"></div>
                    <div className="absolute top-1/2 left-1/3 w-36 h-36 bg-rose-500/30 rounded-full blur-xl animate-ping delay-700"></div>
                </div>
            );
        });

        const DiwaliCenterpiece = React.memo(() => (
            <div className="relative w-56 h-56 flex items-center justify-center my-4">
                {/* Glowing Aura Background */}
                <div className="absolute w-72 h-72 bg-amber-500/20 rounded-full blur-[90px] animate-glow-pulse"></div>
                <div className="absolute w-52 h-52 bg-rose-600/25 rounded-full blur-[60px] animate-glow-pulse delay-700"></div>

                {/* Outer Rotating Mandala / Rangoli Ring */}
                <div className="absolute inset-0 flex items-center justify-center animate-ring-slow opacity-25 text-amber-300">
                    <svg width="220" height="220" viewBox="0 0 200 200" fill="none" stroke="currentColor">
                        <circle cx="100" cy="100" r="95" strokeWidth="1" strokeDasharray="4 8"/>
                        <circle cx="100" cy="100" r="80" strokeWidth="1.5"/>
                        <path d="M100 0 L100 200 M0 100 L200 100 M29.29 29.29 L170.71 170.71 M29.29 170.71 L170.71 29.29" strokeWidth="0.8"/>
                        <polygon points="100,10 120,40 100,70 80,40" strokeWidth="1" fill="none"/>
                        <polygon points="100,190 120,160 100,130 80,160" strokeWidth="1" fill="none"/>
                        <polygon points="10,100 40,120 70,100 40,80" strokeWidth="1" fill="none"/>
                        <polygon points="190,100 160,120 130,100 160,80" strokeWidth="1" fill="none"/>
                    </svg>
                </div>

                {/* Central Diya with Flame Animation */}
                <div className="relative z-10 animate-diya flex flex-col items-center">
                    <div className="text-amber-400 drop-shadow-[0_0_30px_rgba(251,191,36,0.9)]">
                        <Icon name="diya" size={130} />
                    </div>
                </div>
            </div>
        ));

        // --- Core Application ---

        const App = () => {
            const [showWelcome, setShowWelcome] = useState(true);
            const [isDarkMode, setIsDarkMode] = useState(() => {
                const saved = localStorage.getItem(THEME_KEY);
                return saved === null ? true : saved === 'true';
            });

            const [game, setGame] = useState(() => {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) return JSON.parse(data);
                return { players: DEFAULT_ROSTER, rounds: [], history: [], inactive: [], reEntries: new Array(DEFAULT_ROSTER.length).fill(0) };
            });

            const [ui, setUi] = useState({ add: false, editIdx: null, settings: false, history: false, bust: null, confirm: null, isSharing: false });
            const [form, setForm] = useState({ scores: {}, name: '', editIdx: null, editVal: '', error: null });
            const scrollRef = useRef(null);

            const players = game.players;
            const rounds = game.rounds;
            const sessionHistory = game.history || [];
            const inactive = game.inactive || [];
            const reEntries = game.reEntries || new Array(players.length).fill(0);

            const totals = useMemo(() => players.map((_, pIdx) => rounds.reduce((sum, r) => sum + (Array.isArray(r) ? (r[pIdx] || 0) : 0), 0)), [players, rounds]);
            const activeTotals = useMemo(() => totals.filter((_, i) => !inactive.includes(i)), [totals, inactive]);
            const leaderIdx = useMemo(() => rounds.length === 0 ? -1 : totals.findIndex((t, i) => !inactive.includes(i) && t === Math.min(...activeTotals)), [totals, inactive, activeTotals, rounds]);
            const matchOver = (players.length - inactive.length) <= 1 && rounds.length > 0;

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(game));
                localStorage.setItem(THEME_KEY, isDarkMode.toString());
                if (!showWelcome) document.body.style.backgroundColor = isDarkMode ? "#130424" : "#fffbeb";
            }, [game, isDarkMode, showWelcome]);

            useEffect(() => {
                if (!showWelcome && scrollRef.current && game.rounds.length > 0) {
                    scrollRef.current.scrollTo({ top: scrollRef.current.scrollHeight, behavior: 'smooth' });
                }
            }, [game.rounds, showWelcome]);

            const isPlayerLocked = (pIdx) => {
                if (!ui.bust) return false;
                const safeOpponents = ui.bust.proj.filter((t, idx) => 
                    idx !== pIdx && !inactive.includes(idx) && !ui.bust.idxs.includes(idx)
                );
                if (safeOpponents.length === 0) return false; 
                return !safeOpponents.some(t => t < 180);
            };

            const submitScores = (isEditing = false) => {
                setForm(f => ({ ...f, error: null }));
                const entry = players.map((p, i) => inactive.includes(i) ? 0 : parseInt(form.scores[p] || 0));
                
                if (entry.filter((s, i) => !inactive.includes(i) && s === 0).length !== 1) {
                    setForm(f => ({ ...f, error: "Exactly one winner (score 0) is required for this hand." })); return;
                }

                if (isEditing) {
                    const up = [...rounds]; up[ui.editIdx] = entry;
                    setGame(g => ({ ...g, rounds: up }));
                    setUi(u => ({ ...u, editIdx: null })); setForm(f => ({ ...f, scores: {} }));
                } else {
                    const proj = totals.map((t, i) => t + (entry[i] || 0));
                    const bustedIdxs = proj.map((t, i) => (!inactive.includes(i) && t > 200) ? i : -1).filter(i => i !== -1);
                    
                    if (bustedIdxs.length > 0) {
                        const safePlayers = proj.filter((t, i) => !bustedIdxs.includes(i) && !inactive.includes(i));
                        const target = (safePlayers.length > 0 ? Math.max(...safePlayers) : 0) + 1;
                        setUi(u => ({ ...u, bust: { idxs: bustedIdxs, current: bustedIdxs[0], target, pending: entry, proj } }));
                    } else {
                        setGame(g => ({ ...g, rounds: [...g.rounds, entry] }));
                        setUi(u => ({ ...u, add: false })); setForm(f => ({ ...f, scores: {} }));
                    }
                }
            };

            const solveBust = (rejoin) => {
                const scores = [...ui.bust.pending];
                const pIdx = ui.bust.current;
                const locked = isPlayerLocked(pIdx);
                let upIn = [...inactive]; let upRe = [...reEntries];

                if (rejoin && !locked) {
                    scores[pIdx] = ui.bust.target - totals[pIdx];
                    upRe[pIdx] = (upRe[pIdx] || 0) + 1;
                } else {
                    if (!upIn.includes(pIdx)) upIn.push(pIdx);
                }

                const remaining = ui.bust.idxs.filter(i => i !== pIdx);
                if (remaining.length === 0) {
                    setGame(g => ({ ...g, inactive: upIn, reEntries: upRe, rounds: [...g.rounds, scores] }));
                    setUi(u => ({ ...u, bust: null, add: false })); setForm(f => ({ ...f, scores: {} }));
                } else {
                    setGame(g => ({ ...g, inactive: upIn, reEntries: upRe }));
                    setUi(u => ({ ...u, bust: { ...u.bust, current: remaining[0], idxs: remaining, pending: scores } }));
                }
            };

            const midGameJoin = () => {
                if(!form.name.trim()) return;
                const activeHigh = activeTotals.length > 0 ? Math.max(...activeTotals) : Math.max(...totals);
                const joinScore = activeHigh + 1;
                setGame(g => ({
                    ...g, players: [...g.players, form.name.trim()], 
                    reEntries: [...(g.reEntries || new Array(g.players.length).fill(0)), 0],
                    rounds: g.rounds.map((r, i) => i === 0 ? [...r, joinScore] : [...r, 0])
                }));
                setForm(f => ({ ...f, name: '' }));
            };

            const savePlayerNameEdit = (idx) => {
                if (!form.editVal.trim()) return;
                const up = [...players]; up[idx] = form.editVal.trim();
                setGame(prev => ({ ...prev, players: up }));
                setForm(f => ({ ...f, editIdx: null, editVal: '' }));
            };

            const startNewMatch = () => {
                if (rounds.length === 0) return;
                setUi(u => ({ ...u, confirm: { msg: "End this Diwali celebration match and reset points?", fn: () => {
                    const summary = { id: Date.now(), ts: Date.now(), players: [...players], rounds: [...rounds], inactive: [...inactive], reEntries: [...reEntries], finalScores: [...totals] };
                    setGame(prev => ({ ...prev, rounds: [], inactive: [], reEntries: new Array(prev.players.length).fill(0), history: [summary, ...(prev.history || [])].slice(0, 10) }));
                    setUi(prevUi => ({ ...prevUi, confirm: null }));
                }}}));
            };

            const restoreSession = (log) => {
                setUi({ ...ui, confirm: { msg: "Restore session? Current match data will be overwritten.", fn: () => {
                    setGame(prev => ({ 
                        ...prev, 
                        players: log.players, 
                        rounds: log.rounds, 
                        inactive: log.inactive || [], 
                        reEntries: log.reEntries || new Array(log.players.length).fill(0) 
                    }));
                    setUi(u => ({ ...u, history: false, confirm: null }));
                }}});
            };

            const shareAsScreenshot = async () => {
                const element = document.getElementById('scoreboard-capture');
                if (!element || !window.html2canvas) return;
                setUi(prev => ({ ...prev, isSharing: true }));
                try {
                    const canvas = await html2canvas(element, {
                        backgroundColor: isDarkMode ? "#130424" : "#fffbeb",
                        scale: 2, logging: false, useCORS: true
                    });
                    canvas.toBlob(async (blob) => {
                        if (!blob) return;
                        const file = new File([blob], "diwali-rummy-scores.png", { type: "image/png" });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            try { await navigator.share({ files: [file], title: 'Diwali Rummy Scores', text: 'Shubh Diwali Rummy Standings' }); } catch (e) {
                                const link = document.createElement('a'); link.download = 'diwali-rummy.png'; link.href = URL.createObjectURL(blob); link.click();
                            }
                        } else {
                            const link = document.createElement('a'); link.download = 'diwali-rummy.png'; link.href = URL.createObjectURL(blob); link.click();
                        }
                        setUi(prev => ({ ...prev, isSharing: false }));
                    }, "image/png");
                } catch (error) {
                    setUi(prev => ({ ...prev, isSharing: false }));
                }
            };

            return (
                <div className={`fixed inset-0 h-[100dvh] flex flex-col transition-colors duration-500 overflow-hidden ${isDarkMode ? 'diwali-bg-dark text-amber-100' : 'diwali-bg-light text-amber-950'}`}>
                    <FloatingPetalsAndSparkles isDarkMode={isDarkMode} />
                    <RangoliBackground isDarkMode={isDarkMode} />
                    <CelebrationFireworks active={matchOver} />
                    
                    {/* TOP NAVIGATION BAR WITH IPHONE NOTCH/STATUS BAR INSET */}
                    <nav className={`flex-none px-4 pb-3 z-40 pt-ios-safe border-b backdrop-blur-2xl -webkit-backdrop-blur-2xl ${isDarkMode ? 'bg-[#2b0404]/85 border-amber-500/20 text-amber-100' : 'bg-white/85 border-amber-200 text-amber-950 shadow-sm'}`}>
                        <div className="max-w-md mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-2.5">
                                <button onClick={() => setShowWelcome(true)} className="w-9 h-9 rounded-2xl flex items-center justify-center text-amber-950 bg-gradient-to-tr from-amber-500 to-yellow-300 shadow-md shadow-amber-500/30 active:scale-95 transition-transform">
                                    <Icon name="diya" size={22} />
                                </button>
                                <div className="text-left leading-tight">
                                    <h1 className="text-xs font-serif-royal font-black uppercase tracking-wider gold-shimmer-text">Rummy Scorer</h1>
                                    <span className="text-[9px] font-bold uppercase opacity-80 tracking-widest block text-amber-400">✨ Diwali Edition ✨</span>
                                </div>
                            </div>
                            <div className="flex items-center gap-1">
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className={`p-2 rounded-xl transition-all active:scale-90 min-h-[40px] min-w-[40px] flex items-center justify-center ${isDarkMode ? 'bg-amber-500/10 text-amber-300 hover:bg-amber-500/20' : 'bg-amber-100 text-amber-800'}`}>
                                    <Icon name={isDarkMode ? "sun" : "moon"} size={17} />
                                </button>
                                <button onClick={startNewMatch} title="New Match" className="p-2 rounded-xl opacity-80 hover:opacity-100 text-amber-400 active:scale-90 transition-transform min-h-[40px] min-w-[40px] flex items-center justify-center">
                                    <Icon name="rotate-ccw" size={17} />
                                </button>
                                <button onClick={() => setUi({...ui, history: true})} title="History" className="p-2 rounded-xl opacity-80 hover:opacity-100 text-amber-400 active:scale-90 transition-transform min-h-[40px] min-w-[40px] flex items-center justify-center">
                                    <Icon name="history" size={17} />
                                </button>
                                <button onClick={() => setUi({...ui, settings: true})} title="Players Settings" className="p-2 rounded-xl opacity-80 hover:opacity-100 text-amber-400 active:scale-90 transition-transform min-h-[40px] min-w-[40px] flex items-center justify-center">
                                    <Icon name="settings" size={17} />
                                </button>
                            </div>
                        </div>
                    </nav>

                    {/* WELCOME / FESTIVE LANDING SCREEN */}
                    {showWelcome ? (
                        <div className={`fixed inset-0 h-[100dvh] flex flex-col items-center justify-center p-6 z-50 pt-ios-safe pb-ios-safe transition-all ${isDarkMode ? 'diwali-bg-dark text-amber-100' : 'diwali-bg-light text-amber-950'}`}>
                            <FloatingPetalsAndSparkles isDarkMode={isDarkMode} />
                            <RangoliBackground isDarkMode={isDarkMode} />
                            
                            <div className="relative z-20 flex flex-col items-center max-w-xs text-center my-auto">
                                <span className="text-[11px] font-serif-royal uppercase tracking-[0.35em] text-amber-400 mb-1 font-bold flex items-center gap-1.5">
                                    <span>✨</span> Shubh Deepavali <span>✨</span>
                                </span>
                                
                                <DiwaliCenterpiece />

                                <h1 className="text-2xl font-serif-royal font-black uppercase text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-amber-400 to-yellow-500 tracking-tight mt-2">
                                    Festive Rummy
                                </h1>
                                <p className="text-xs font-medium opacity-80 mt-2 mb-6 leading-relaxed max-w-xs">
                                    Celebrate Diwali with friends & family. Track points effortlessly with buy-ins, automatic totals, and festive leaderboard crowns.
                                </p>

                                <button onClick={() => setShowWelcome(false)} className="w-full py-3.5 px-6 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-600 text-amber-950 font-serif-royal font-black uppercase tracking-widest rounded-2xl shadow-xl shadow-amber-500/25 active:scale-95 transition-all border border-yellow-200 flex items-center justify-center gap-2 text-xs min-h-[48px]">
                                    <Icon name="diya" size={20} /> Enter Tournament
                                </button>
                            </div>
                        </div>
                    ) : (
                        /* MAIN SCOREBOARD VIEW */
                        <div id="scoreboard-capture" className="flex-1 flex flex-col overflow-hidden relative z-20">
                            {/* SCOREBOARD HEADER */}
                            <div className={`flex-none flex border-b-2 z-20 ${isDarkMode ? 'bg-[#3b070c]/90 border-amber-500/20 text-amber-100' : 'bg-white/90 border-amber-200 text-amber-950 shadow-sm'}`}>
                                <div className="w-11 flex items-center justify-center text-[8.5px] font-serif-royal font-bold text-amber-500/80 uppercase">Hand</div>
                                <div className="flex-1 flex">
                                    {players.map((p, i) => (
                                        <div key={i} className={`flex-1 border-r last:border-r-0 border-amber-500/10 py-2.5 px-0.5 text-center truncate transition-all duration-300 ${inactive.includes(i) ? 'player-inactive bg-red-950/20' : ''}`}>
                                            <div className="flex flex-col items-center justify-center min-w-0">
                                                <span className={`text-[10px] font-black uppercase truncate block w-full tracking-wide ${isDarkMode ? 'text-amber-200' : 'text-amber-900'}`}>{p}</span>
                                                {reEntries[i] > 0 && <span className="bg-amber-500/20 text-amber-400 text-[7.5px] font-bold px-1.5 py-0.5 rounded-full border border-amber-500/40 mt-0.5">R#{reEntries[i]}</span>}
                                                {inactive.includes(i) && <span className="text-[6.5px] text-rose-500 font-bold uppercase mt-0.5 tracking-tighter">Out</span>}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* ROUNDS LIST SCROLLABLE AREA */}
                            <div ref={scrollRef} className="flex-1 overflow-y-auto no-scrollbar overscroll-contain">
                                {rounds.length === 0 ? (
                                    <div className="h-full flex flex-col items-center justify-center opacity-40 p-6 text-center">
                                        <Icon name="sparkles" size={36} className="text-amber-400 mb-2 animate-pulse" />
                                        <p className="text-xs font-serif-royal uppercase tracking-widest font-bold">No Hands Recorded</p>
                                        <span className="text-[10px] opacity-70 mt-1">Tap 'Record Hand Score' below to begin</span>
                                    </div>
                                ) : (
                                    rounds.map((round, rIdx) => (
                                        <div key={rIdx} className={`flex border-b transition-colors ${isDarkMode ? 'border-amber-500/10 hover:bg-amber-500/5 text-amber-100' : 'border-amber-100 hover:bg-amber-50/50 text-amber-950'}`}>
                                            <div className="w-11 flex flex-col items-center justify-center py-2.5">
                                                <span className="text-[9.5px] font-mono font-bold text-amber-500/70">#{rIdx + 1}</span>
                                                <button onClick={() => { setUi({...ui, editIdx: rIdx}); const c = {}; players.forEach((p, i) => c[p] = round[i]); setForm({...form, scores: c}); }} className="text-amber-400/50 hover:text-amber-400 mt-0.5 active:scale-90 transition-all p-1">
                                                    <Icon name="pencil-line" size={12} />
                                                </button>
                                            </div>
                                            <div className="flex-1 flex">
                                                {round.map((score, cIdx) => (
                                                    <div key={cIdx} className={`flex-1 border-r last:border-r-0 border-amber-500/10 flex items-center justify-center py-2.5 transition-all duration-300 ${inactive.includes(cIdx) ? 'opacity-20 grayscale' : ''}`}>
                                                        {score === 0 ? (
                                                            <span className="w-6 h-6 rounded-full bg-gradient-to-tr from-amber-500 to-yellow-300 text-amber-950 flex items-center justify-center text-[11px] font-black shadow-md border border-yellow-200 animate-pulse">0</span>
                                                        ) : (
                                                            <span className={`text-xs font-bold tabular-nums ${isDarkMode ? 'text-amber-100/90' : 'text-amber-950'}`}>{score}</span>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>

                            {/* TOTALS FOOTER ROW */}
                            <div className={`flex-none flex text-amber-100 shadow-[0_-10px_25px_rgba(0,0,0,0.4)] z-30 ${isDarkMode ? 'bg-[#3b070c] border-t-2 border-amber-500/30' : 'bg-amber-800 text-amber-100'}`}>
                                <div className="w-11 flex items-center justify-center text-[8.5px] font-serif-royal font-black bg-amber-950/40 text-amber-300 uppercase">Total</div>
                                <div className="flex-1 flex">
                                    {totals.map((total, i) => (
                                        <div key={i} className={`flex-1 py-3 border-r last:border-r-0 border-amber-500/20 text-center font-black text-base min-w-0 transition-all duration-300 ${inactive.includes(i) ? 'total-inactive' : ''}`}>
                                            <span className="flex items-center justify-center gap-1">
                                                {total} 
                                                {i === leaderIdx && !inactive.includes(i) && rounds.length > 0 && (
                                                    <Icon name="crown" size={15} className="text-yellow-400 animate-bounce" />
                                                )}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* BOTTOM ACTION BAR WITH IPHONE HOME-BAR SAFE INSET */}
                    {!showWelcome && (
                        <div className={`p-3 pb-ios-safe flex-none border-t z-30 ${isDarkMode ? 'bg-[#2b0404]/95 border-amber-500/20' : 'bg-white border-amber-200 shadow-xl'}`}>
                            {matchOver ? (
                                <div className="text-center p-1 animate-in zoom-in-95 duration-500">
                                    <h4 className="text-lg font-serif-royal font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-yellow-200 to-amber-400 uppercase mb-2">
                                        🏆 Shubh Diwali Champion! 🏆
                                    </h4>
                                    <button onClick={startNewMatch} className="px-6 py-3 bg-gradient-to-r from-amber-500 to-yellow-400 text-amber-950 rounded-xl font-serif-royal font-black uppercase text-xs shadow-lg active:scale-95 transition-all min-h-[44px]">
                                        Start New Tournament
                                    </button>
                                </div>
                            ) : (
                                <div className="flex gap-2.5 max-w-md mx-auto">
                                    <button onClick={() => setUi({...ui, add: true})} className="flex-1 h-12 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-600 hover:brightness-110 text-amber-950 rounded-xl font-serif-royal font-black uppercase tracking-wider shadow-md shadow-amber-500/20 flex items-center justify-center gap-2 active:scale-95 transition-all border border-yellow-200 text-xs min-h-[48px]">
                                        <Icon name="plus" size={20} /> Record Hand Score
                                    </button>
                                    <button onClick={shareAsScreenshot} disabled={ui.isSharing} className={`px-4 h-12 rounded-xl font-bold shadow-md flex items-center justify-center transition-all active:scale-95 min-h-[48px] min-w-[48px] ${isDarkMode ? 'bg-amber-500/10 text-amber-300 border border-amber-500/30' : 'bg-amber-100 text-amber-900'} ${ui.isSharing ? 'animate-pulse' : ''}`}>
                                        {ui.isSharing ? <Icon name="loader" size={20} /> : <Icon name="camera" size={20} />}
                                    </button>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
