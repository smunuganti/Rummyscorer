<!DOCTYPE html>
<html lang="en">
<head>

    <!-- App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rummy Scorer Diwali">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2b0404">
    
    <!-- Diwali Icons -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%232b0404%22/><text y=%22.9em%22 font-size=%2280%22 x=%2210%22>🪔</text></svg>">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪔</text></svg>">

    <title>Rummy Scorer - Royal Diwali Edition</title>
    
    <!-- Core Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Canvas Library for Screenshots & Fireworks -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* DIWALI FESTIVE ANIMATIONS & THEME STYLING */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

        :root {
            --font-serif: 'Cinzel', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }

        @keyframes diya-flame-flicker {
            0%, 100% { transform: scale(1) rotate(-1deg); filter: drop-shadow(0 0 12px rgba(251, 191, 36, 0.9)) drop-shadow(0 0 25px rgba(245, 158, 11, 0.7)); }
            25% { transform: scale(1.08, 0.95) rotate(1deg); filter: drop-shadow(0 0 15px rgba(251, 191, 36, 1)) drop-shadow(0 0 35px rgba(239, 68, 68, 0.8)); }
            50% { transform: scale(0.96, 1.06) rotate(-2deg); filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.8)) drop-shadow(0 0 20px rgba(251, 191, 36, 0.6)); }
            75% { transform: scale(1.04, 1.02) rotate(2deg); filter: drop-shadow(0 0 18px rgba(251, 191, 36, 0.95)) drop-shadow(0 0 30px rgba(245, 158, 11, 0.75)); }
        }

        @keyframes floating-petal {
            0% { transform: translateY(-10vh) rotate(0deg) translateX(0px); opacity: 0; }
            10% { opacity: var(--item-opacity); }
            90% { opacity: var(--item-opacity); }
            100% { transform: translateY(110vh) rotate(540deg) translateX(60px); opacity: 0; }
        }

        @keyframes rangoli-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes soft-glow-pulse {
            0%, 100% { opacity: 0.35; transform: scale(1); filter: blur(60px); }
            50% { opacity: 0.65; transform: scale(1.15); filter: blur(80px); }
        }

        @keyframes festive-bg-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes gold-shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .animate-flame {
            animation: diya-flame-flicker 2.5s ease-in-out infinite;
            transform-origin: bottom center;
            will-change: transform, filter;
        }

        .animate-petal {
            animation: floating-petal linear infinite;
            will-change: transform, opacity;
        }

        .animate-rangoli {
            animation: rangoli-spin 90s linear infinite;
            will-change: transform;
        }

        .animate-festive-glow {
            animation: soft-glow-pulse 6s ease-in-out infinite;
            will-change: transform, opacity;
        }

        /* Festive Background Themes */
        .diwali-bg-dark {
            background: linear-gradient(135deg, #1c0202, #3b070c, #4a0e17, #26050a, #1a0104);
            background-size: 300% 300%;
            animation: festive-bg-shift 20s ease infinite;
            will-change: background-position;
        }

        .diwali-bg-light {
            background: linear-gradient(135deg, #fffbeb, #fef3c7, #fde68a, #fff7ed, #fffbeb);
            background-size: 300% 300%;
            animation: festive-bg-shift 20s ease infinite;
            will-change: background-position;
        }

        /* Glassmorphism & Gold Effects */
        .royal-glass-dark {
            background: rgba(43, 4, 4, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(245, 158, 11, 0.25);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(254, 243, 199, 0.15);
        }

        .royal-glass-light {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(217, 119, 6, 0.25);
            box-shadow: 0 10px 30px -5px rgba(180, 83, 9, 0.1), inset 0 1px 1px rgba(255, 255, 255, 0.8);
        }

        .gold-shimmer-text {
            background: linear-gradient(90deg, #f59e0b, #fef08a, #d97706, #fef08a, #f59e0b);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: gold-shimmer 4s linear infinite;
        }

        .font-serif-royal { font-family: var(--font-serif); }
        .font-sans-royal { font-family: var(--font-sans); }

        ::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        body {
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            font-family: var(--font-sans);
            user-select: none;
            height: 100vh;
            width: 100vw;
            background-color: #2b0404;
            transition: background-color 0.5s ease;
        }

        input { user-select: text; }
        .pt-safe { padding-top: env(safe-area-inset-top); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }

        /* Player Inactive & Eliminative Styles */
        .player-inactive {
            filter: grayscale(0.85) opacity(0.35) !important;
            pointer-events: none;
        }
        .total-inactive {
            text-decoration: line-through;
            opacity: 0.4;
        }
    </style>
</head>
<body id="app-body">
    <div id="root"></div>

    <script>

                "x": (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>

                ),
                "user-minus": (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>

                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>

                ),
                "flame": (
                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>

                "loader": (

                    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>

            return icons[name] || (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>

        });

        const STORAGE_KEY = "rummy_scorer_diwali_v1";
        const THEME_KEY = "rummy_scorer_diwali_theme";
        const DEFAULT_ROSTER = ['Player 1', 'Player 2', 'Player 3'];

        // --- Ambient Festive Visual Components ---

        const FloatingPetalsAndSparkles = React.memo(({ isDarkMode }) => {
            const elements = useMemo(() => {
                const items = ['🌸', '🪔', '✨', '🌼', '⭐'];
                return Array.from({ length: 30 }).map((_, i) => ({
                    id: i,
                    left: Math.random() * 100,
                    opacity: 0.2 + Math.random() * 0.5,
                    duration: 7 + Math.random() * 8,
                    delay: Math.random() * 6,
                    size: 14 + Math.random() * 14,
                    char: items[i % items.length]
                }));
            }, []);

            return (
                <div className="fixed inset-0 pointer-events-none overflow-hidden z-10 opacity-60">
                    {elements.map(item => (
                        <div key={item.id} className="absolute animate-petal text-amber-300" style={{ 
                            left: `${item.left}%`, 
                            top: '-40px',
                            fontSize: `${item.size}px`,
                            '--item-opacity': item.opacity,
                            animationDuration: `${item.duration}s`, 
                            animationDelay: `${item.delay}s` 
                        }}>
                            {item.char}
                        </div>
                    ))}
                </div>
            );
        });

        // Background Rangoli Motif Vector Overlay
        const RangoliBackground = React.memo(({ isDarkMode }) => (
            <div className="fixed inset-0 pointer-events-none flex items-center justify-center overflow-hidden z-0 opacity-15">
                <div className="w-[700px] h-[700px] animate-rangoli">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" className="w-full h-full text-amber-500 fill-current">
                        <circle cx="100" cy="100" r="95" fill="none" stroke="currentColor" strokeWidth="0.8" strokeDasharray="3 3"/>
                        <circle cx="100" cy="100" r="75" fill="none" stroke="currentColor" strokeWidth="0.5"/>
                        <circle cx="100" cy="100" r="55" fill="none" stroke="currentColor" strokeWidth="1"/>
                        {Array.from({ length: 12 }).map((_, i) => (
                            <g key={i} transform={`rotate(${i * 30} 100 100)`}>
                                <path d="M100 20 C108 40, 108 50, 100 60 C92 50, 92 40, 100 20 Z" opacity="0.6"/>
                                <circle cx="100" cy="15" r="2.5"/>
                                <path d="M100 65 C115 80, 115 90, 100 100 C85 90, 85 80, 100 65 Z" opacity="0.3"/>
                            </g>
                        ))}
                    </svg>
                </div>
            </div>
        ));

        // Animated Central Diya Artwork for Welcome Screen
        const DiwaliCenterpiece = React.memo(() => (
            <div className="relative w-56 h-56 flex items-center justify-center my-4">
                {/* Glowing Aura Spheres */}
                <div className="absolute w-72 h-72 bg-amber-500/25 rounded-full blur-[90px] animate-festive-glow"></div>
                <div className="absolute w-48 h-48 bg-rose-600/20 rounded-full blur-[60px] animate-festive-glow" style={{ animationDelay: '-3s' }}></div>
                
                {/* Rangoli Plate Base */}
                <div className="absolute w-44 h-44 rounded-full border-2 border-dashed border-amber-400/30 animate-rangoli opacity-70"></div>
                
                {/* Large Diya Visual */}
                <div className="relative z-10 flex flex-col items-center">
                    {/* Flame */}
                    <div className="relative mb-[-12px] z-20">
                        <div className="w-12 h-20 bg-gradient-to-t from-red-600 via-amber-500 to-yellow-200 rounded-full animate-flame"></div>
                    </div>
                    {/* Diya Base Vessel */}
                    <div className="w-36 h-14 bg-gradient-to-r from-amber-700 via-yellow-600 to-amber-800 rounded-b-full border-t-4 border-amber-300 shadow-2xl flex items-center justify-center relative overflow-hidden">
                        <div className="absolute inset-0 bg-amber-400/20 backdrop-blur-sm"></div>
                        <span className="text-yellow-200 text-xs font-serif-royal font-bold tracking-widest relative z-10">🪔 SHUBH DIWALI 🪔</span>
                    </div>
                </div>
            </div>
        ));

        // Festive Winner Fireworks Visual Effect Canvas
        const CelebrationFireworks = React.memo(({ active }) => {
            const canvasRef = useRef(null);

            useEffect(() => {
                if (!active) return;
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationFrameId;

                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                const particles = [];
                const colors = ['#f59e0b', '#fbbf24', '#ef4444', '#f43f5e', '#a855f7', '#3b82f6'];

                const createFirework = () => {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * (canvas.height * 0.5);
                    const count = 40;
                    for (let i = 0; i < count; i++) {
                        const angle = (Math.PI * 2 * i) / count;
                        const speed = Math.random() * 4 + 2;
                        particles.push({
                            x, y,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            color: colors[Math.floor(Math.random() * colors.length)],
                            radius: Math.random() * 3 + 1,
                            alpha: 1,
                            decay: Math.random() * 0.02 + 0.015
                        });
                    }
                };

                let interval = setInterval(createFirework, 400);

                const render = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    for (let i = particles.length - 1; i >= 0; i--) {
                        const p = particles[i];
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.05; // gravity
                        p.alpha -= p.decay;

                        if (p.alpha <= 0) {
                            particles.splice(i, 1);
                            continue;
                        }

                        ctx.save();
                        ctx.globalAlpha = p.alpha;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = p.color;
                        ctx.fill();
                        ctx.restore();
                    }
                    animationFrameId = requestAnimationFrame(render);
                };

                render();

                return () => {
                    clearInterval(interval);
                    cancelAnimationFrame(animationFrameId);
                };
            }, [active]);

            if (!active) return null;
            return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-[100]" />;
        });

        // --- Main Application Component ---

        const App = () => {
            const [showWelcome, setShowWelcome] = useState(true);
            const [isDarkMode, setIsDarkMode] = useState(() => {
                const saved = localStorage.getItem(THEME_KEY);
                return saved === null ? true : saved === 'true';
            });

            // Primary Game State
            const [game, setGame] = useState(() => {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) return JSON.parse(data);
                return { players: DEFAULT_ROSTER, rounds: [], history: [], inactive: [], reEntries: new Array(DEFAULT_ROSTER.length).fill(0) };
            });

            // UI State
            const [ui, setUi] = useState({ add: false, editIdx: null, settings: false, history: false, bust: null, confirm: null, isSharing: false });
            const [form, setForm] = useState({ scores: {}, name: '', editIdx: null, editVal: '', error: null });
            const scrollRef = useRef(null);

            const players = game.players;
            const rounds = game.rounds;
            const sessionHistory = game.history || [];
            const inactive = game.inactive || [];
            const reEntries = game.reEntries || new Array(players.length).fill(0);

            // Calculation Utilities
            const totals = useMemo(() => players.map((_, pIdx) => rounds.reduce((sum, r) => sum + (Array.isArray(r) ? (r[pIdx] || 0) : 0), 0)), [players, rounds]);
            const activeTotals = useMemo(() => totals.filter((_, i) => !inactive.includes(i)), [totals, inactive]);
            const leaderIdx = useMemo(() => rounds.length === 0 ? -1 : totals.findIndex((t, i) => !inactive.includes(i) && t === Math.min(...activeTotals)), [totals, inactive, activeTotals, rounds]);
            const matchOver = (players.length - inactive.length) <= 1 && rounds.length > 0;

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(game));
                localStorage.setItem(THEME_KEY, isDarkMode.toString());
                if (!showWelcome) document.body.style.backgroundColor = isDarkMode ? "#2b0404" : "#fffbeb";
            }, [game, isDarkMode, showWelcome]);

            useEffect(() => {
                if (!showWelcome && scrollRef.current && game.rounds.length > 0) {
                    scrollRef.current.scrollTo({ top: scrollRef.current.scrollHeight, behavior: 'smooth' });
                }
            }, [game.rounds, showWelcome]);

            // Lock Rule: Buy-In Re-Entry is disabled if all active safe opponents are at score >= 180
            const isPlayerLocked = (pIdx) => {
                if (!ui.bust) return false;
                const safeOpponents = ui.bust.proj.filter((t, idx) => 
                    idx !== pIdx && !inactive.includes(idx) && !ui.bust.idxs.includes(idx)
                );
                if (safeOpponents.length === 0) return false; 
                return !safeOpponents.some(t => t < 180);
            };

            const submitScores = (isEditing = false) => {
                setForm(f => ({ ...f, error: null }));
                const entry = players.map((p, i) => inactive.includes(i) ? 0 : parseInt(form.scores[p] || 0));
                
                // Exactly 1 player must get 0 points (the hand winner)
                if (entry.filter((s, i) => !inactive.includes(i) && s === 0).length !== 1) {
                    setForm(f => ({ ...f, error: "One winner (score 0) is required for this hand." }));
                    return;
                }

                if (isEditing) {
                    const up = [...rounds]; 
                    up[ui.editIdx] = entry;
                    setGame(g => ({ ...g, rounds: up }));
                    setUi(u => ({ ...u, editIdx: null })); 
                    setForm(f => ({ ...f, scores: {} }));
                } else {
                    const proj = totals.map((t, i) => t + (entry[i] || 0));
                    const bustedIdxs = proj.map((t, i) => (!inactive.includes(i) && t > 200) ? i : -1).filter(i => i !== -1);
                    
                    if (bustedIdxs.length > 0) {
                        const safePlayers = proj.filter((t, i) => !bustedIdxs.includes(i) && !inactive.includes(i));
                        const target = (safePlayers.length > 0 ? Math.max(...safePlayers) : 0) + 1;
                        setUi(u => ({ ...u, bust: { idxs: bustedIdxs, current: bustedIdxs[0], target, pending: entry, proj } }));
                    } else {
                        setGame(g => ({ ...g, rounds: [...g.rounds, entry] }));
                        setUi(u => ({ ...u, add: false })); 
                        setForm(f => ({ ...f, scores: {} }));
                    }
                }
            };

            const solveBust = (rejoin) => {
                const scores = [...ui.bust.pending];
                const pIdx = ui.bust.current;
                const locked = isPlayerLocked(pIdx);
                let upIn = [...inactive]; 
                let upRe = [...reEntries];

                if (rejoin && !locked) {
                    scores[pIdx] = ui.bust.target - totals[pIdx];
                    upRe[pIdx] = (upRe[pIdx] || 0) + 1;
                } else {
                    if (!upIn.includes(pIdx)) upIn.push(pIdx);
                }

                const remaining = ui.bust.idxs.filter(i => i !== pIdx);
                if (remaining.length === 0) {
                    setGame(g => ({ ...g, inactive: upIn, reEntries: upRe, rounds: [...g.rounds, scores] }));
                    setUi(u => ({ ...u, bust: null, add: false })); 
                    setForm(f => ({ ...f, scores: {} }));
                } else {
                    setGame(g => ({ ...g, inactive: upIn, reEntries: upRe }));
                    setUi(u => ({ ...u, bust: { ...u.bust, current: remaining[0], idxs: remaining, pending: scores } }));
                }
            };

            const midGameJoin = () => {
                if (!form.name.trim()) return;
                const activeHigh = activeTotals.length > 0 ? Math.max(...activeTotals) : Math.max(...totals);
                const joinScore = activeHigh + 1;
                setGame(g => ({
                    ...g, 
                    players: [...g.players, form.name.trim()], 
                    reEntries: [...(g.reEntries || new Array(g.players.length).fill(0)), 0],
                    rounds: g.rounds.map((r, i) => i === 0 ? [...r, joinScore] : [...r, 0])
                }));
                setForm(f => ({ ...f, name: '' }));
            };

            const savePlayerNameEdit = (idx) => {
                if (!form.editVal.trim()) return;
                const up = [...players]; 
                up[idx] = form.editVal.trim();
                setGame(prev => ({ ...prev, players: up }));
                setForm(f => ({ ...f, editIdx: null, editVal: '' }));
            };

            const startNewMatch = () => {
                if (rounds.length === 0) return;
                setUi(u => ({ 
                    ...u, 
                    confirm: { 
                        msg: "Conclude current match and save to history log?", 
                        fn: () => {
                            const summary = { 
                                id: Date.now(), 
                                ts: Date.now(), 
                                players: [...players], 
                                rounds: [...rounds], 
                                inactive: [...inactive], 
                                reEntries: [...reEntries], 
                                finalScores: [...totals] 
                            };
                            setGame(prev => ({ 
                                ...prev, 
                                rounds: [], 
                                inactive: [], 
                                reEntries: new Array(prev.players.length).fill(0), 
                                history: [summary, ...(prev.history || [])].slice(0, 15) 
                            }));
                            setUi(prevUi => ({ ...prevUi, confirm: null }));
                        }
                    }
                }));
            };

            const restoreSession = (log) => {
                setUi({ 
                    ...ui, 
                    confirm: { 
                        msg: "Restore this game log? Current scoreboard will be updated.", 
                        fn: () => {
                            setGame(prev => ({ 
                                ...prev, 
                                players: log.players, 
                                rounds: log.rounds, 
                                inactive: log.inactive || [], 
                                reEntries: log.reEntries || new Array(log.players.length).fill(0) 
                            }));
                            setUi(u => ({ ...u, history: false, confirm: null }));
                        }
                    }
                });
            };

            const shareAsScreenshot = async () => {
                const element = document.getElementById('scoreboard-capture');
                if (!element || !window.html2canvas) return;
                setUi(prev => ({ ...prev, isSharing: true }));
                try {
                    const canvas = await html2canvas(element, {
                        backgroundColor: isDarkMode ? "#2b0404" : "#fffbeb",
                        scale: 2, 
                        logging: false, 
                        useCORS: true
                    });
                    canvas.toBlob(async (blob) => {
                        if (!blob) return;
                        const file = new File([blob], "diwali-rummy-scores.png", { type: "image/png" });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            try { 
                                await navigator.share({ files: [file], title: 'Diwali Rummy Match', text: 'Shubh Diwali Rummy Scorecard' }); 
                            } catch (e) {
                                const link = document.createElement('a'); 
                                link.download = 'diwali-rummy-scorecard.png'; 
                                link.href = URL.createObjectURL(blob); 
                                link.click();
                            }
                        } else {
                            const link = document.createElement('a'); 
                            link.download = 'diwali-rummy-scorecard.png'; 
                            link.href = URL.createObjectURL(blob); 
                            link.click();
                        }
                        setUi(prev => ({ ...prev, isSharing: false }));
                    }, "image/png");
                } catch (error) {
                    setUi(prev => ({ ...prev, isSharing: false }));
                }
            };

            return (
                <div className={`fixed inset-0 flex flex-col transition-colors duration-500 overflow-hidden ${isDarkMode ? 'diwali-bg-dark text-amber-100' : 'diwali-bg-light text-amber-950'}`}>
                    <FloatingPetalsAndSparkles isDarkMode={isDarkMode} />
                    <RangoliBackground isDarkMode={isDarkMode} />
                    <CelebrationFireworks active={matchOver} />
                    
                    {/* TOP NAVIGATION BAR */}
                    <nav className={`flex-none px-4 py-3 z-40 pt-safe border-b backdrop-blur-xl ${isDarkMode ? 'bg-[#2b0404]/80 border-amber-500/20 text-amber-100' : 'bg-white/80 border-amber-200 text-amber-950 shadow-sm'}`}>
                        <div className="max-w-4xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <button onClick={() => setShowWelcome(true)} className="w-10 h-10 rounded-2xl flex items-center justify-center text-amber-950 bg-gradient-to-tr from-amber-500 to-yellow-300 shadow-lg shadow-amber-500/30 active:scale-95 transition-transform">
                                    <Icon name="diya" size={24} />
                                </button>
                                <div className="text-left">
                                    <h1 className="text-sm font-serif-royal font-black uppercase tracking-wider gold-shimmer-text">Rummy Scorer</h1>
                                    <span className="text-[9px] font-bold uppercase opacity-80 tracking-widest block text-amber-400">✨ Diwali Edition ✨</span>
                                </div>
                            </div>
                            <div className="flex items-center gap-1.5">
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className={`p-2.5 rounded-xl transition-all active:scale-90 ${isDarkMode ? 'bg-amber-500/10 text-amber-300 hover:bg-amber-500/20' : 'bg-amber-100 text-amber-800'}`}>
                                    <Icon name={isDarkMode ? "sun" : "moon"} size={18} />
                                </button>
                                <button onClick={startNewMatch} title="New Match" className="p-2.5 rounded-xl opacity-80 hover:opacity-100 text-amber-400 active:scale-90 transition-transform">
                                    <Icon name="rotate-ccw" size={18} />
                                </button>
                                <button onClick={() => setUi({...ui, history: true})} title="History" className="p-2.5 rounded-xl opacity-80 hover:opacity-100 text-amber-400 active:scale-90 transition-transform">
                                    <Icon name="history" size={18} />
                                </button>
                                <button onClick={() => setUi({...ui, settings: true})} title="Players Settings" className="p-2.5 rounded-xl opacity-80 hover:opacity-100 text-amber-400 active:scale-90 transition-transform">
                                    <Icon name="settings" size={18} />
                                </button>
                            </div>
                        </div>
                    </nav>

                    {/* WELCOME / FESTIVE LANDING SCREEN */}
                    {showWelcome ? (
                        <div className={`fixed inset-0 flex flex-col items-center justify-center p-6 z-50 transition-all ${isDarkMode ? 'diwali-bg-dark text-amber-100' : 'diwali-bg-light text-amber-950'}`}>
                            <FloatingPetalsAndSparkles isDarkMode={isDarkMode} />
                            <RangoliBackground isDarkMode={isDarkMode} />
                            
                            <div className="relative z-20 flex flex-col items-center max-w-sm text-center">
                                <span className="text-xs font-serif-royal uppercase tracking-[0.4em] text-amber-400 mb-2 font-bold flex items-center gap-2">
                                    <span>✨</span> Shubh Deepavali <span>✨</span>
                                </span>
                                
                                <DiwaliCenterpiece />

                                <h1 className="text-3xl font-serif-royal font-black uppercase text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-amber-400 to-yellow-500 tracking-tight mt-4">
                                    Festive Rummy
                                </h1>
                                <p className="text-xs font-medium opacity-80 mt-2 mb-8 leading-relaxed max-w-xs">
                                    Celebrate Diwali with friends & family. Track points effortlessly with buy-ins, automatic totals, and festive leaderboard crowns.
                                </p>

                                <button onClick={() => setShowWelcome(false)} className="w-full py-4 px-8 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-600 text-amber-950 font-serif-royal font-black uppercase tracking-widest rounded-2xl shadow-xl shadow-amber-500/25 active:scale-95 transition-all border border-yellow-200 flex items-center justify-center gap-2">
                                    <Icon name="diya" size={22} /> Enter Tournament
                                </button>
                            </div>
                        </div>
                    ) : (
                        /* MAIN SCOREBOARD VIEW */
                        <div id="scoreboard-capture" className="flex-1 flex flex-col overflow-hidden relative z-20">
                            {/* SCOREBOARD HEADER */}
                            <div className={`flex-none flex border-b-2 z-20 ${isDarkMode ? 'bg-[#3b070c]/80 border-amber-500/20 text-amber-100' : 'bg-white/90 border-amber-200 text-amber-950 shadow-sm'}`}>
                                <div className="w-12 flex items-center justify-center text-[9px] font-serif-royal font-bold text-amber-500/80 uppercase">Hand</div>
                                <div className="flex-1 flex">
                                    {players.map((p, i) => (
                                        <div key={i} className={`flex-1 border-r last:border-r-0 border-amber-500/10 py-3 px-1 text-center truncate transition-all duration-300 ${inactive.includes(i) ? 'player-inactive bg-red-950/20' : ''}`}>
                                            <div className="flex flex-col items-center justify-center min-w-0">
                                                <span className={`text-[11px] font-black uppercase truncate block w-full tracking-wider ${isDarkMode ? 'text-amber-200' : 'text-amber-900'}`}>{p}</span>
                                                {reEntries[i] > 0 && <span className="bg-amber-500/20 text-amber-400 text-[8px] font-bold px-1.5 py-0.5 rounded-full border border-amber-500/40 mt-0.5">Re-entry #{reEntries[i]}</span>}
                                                {inactive.includes(i) && <span className="text-[7px] text-rose-500 font-bold uppercase mt-0.5 tracking-tighter">Eliminated</span>}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* ROUNDS LIST SCROLLABLE AREA */}
                            <div ref={scrollRef} className="flex-1 overflow-y-auto no-scrollbar">
                                {rounds.length === 0 ? (
                                    <div className="h-full flex flex-col items-center justify-center opacity-40 p-8 text-center">
                                        <Icon name="sparkles" size={40} className="text-amber-400 mb-3 animate-pulse" />
                                        <p className="text-xs font-serif-royal uppercase tracking-widest font-bold">No Hands Recorded</p>
                                        <span className="text-[10px] opacity-70 mt-1">Tap 'Record Hand Score' below to begin</span>
                                    </div>
                                ) : (
                                    rounds.map((round, rIdx) => (
                                        <div key={rIdx} className={`flex border-b transition-colors ${isDarkMode ? 'border-amber-500/10 hover:bg-amber-500/5 text-amber-100' : 'border-amber-100 hover:bg-amber-50/50 text-amber-950'}`}>
                                            <div className="w-12 flex flex-col items-center justify-center py-3">
                                                <span className="text-[10px] font-mono font-bold text-amber-500/70">#{rIdx + 1}</span>
                                                <button onClick={() => { setUi({...ui, editIdx: rIdx}); const c = {}; players.forEach((p, i) => c[p] = round[i]); setForm({...form, scores: c}); }} className="text-amber-400/50 hover:text-amber-400 mt-0.5 active:scale-90 transition-all">
                                                    <Icon name="pencil-line" size={13} />
                                                </button>
                                            </div>
                                            <div className="flex-1 flex">
                                                {round.map((score, cIdx) => (
                                                    <div key={cIdx} className={`flex-1 border-r last:border-r-0 border-amber-500/10 flex items-center justify-center py-3 transition-all duration-300 ${inactive.includes(cIdx) ? 'opacity-20 grayscale' : ''}`}>
                                                        {score === 0 ? (
                                                            <span className="w-7 h-7 rounded-full bg-gradient-to-tr from-amber-500 to-yellow-300 text-amber-950 flex items-center justify-center text-xs font-black shadow-md border border-yellow-200 animate-pulse">0</span>
                                                        ) : (
                                                            <span className={`text-sm font-bold tabular-nums ${isDarkMode ? 'text-amber-100/90' : 'text-amber-950'}`}>{score}</span>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>

                            {/* TOTALS FOOTER ROW */}
                            <div className={`flex-none flex text-amber-100 shadow-[0_-10px_30px_rgba(0,0,0,0.4)] z-30 ${isDarkMode ? 'bg-[#3b070c] border-t-2 border-amber-500/30' : 'bg-amber-800 text-amber-100'}`}>
                                <div className="w-12 flex items-center justify-center text-[9px] font-serif-royal font-black bg-amber-950/40 text-amber-300 uppercase">Total</div>
                                <div className="flex-1 flex">
                                    {totals.map((total, i) => (
                                        <div key={i} className={`flex-1 py-3.5 border-r last:border-r-0 border-amber-500/20 text-center font-black text-lg min-w-0 transition-all duration-300 ${inactive.includes(i) ? 'total-inactive' : ''}`}>
                                            <span className="flex items-center justify-center gap-1.5">
                                                {total} 
                                                {i === leaderIdx && !inactive.includes(i) && rounds.length > 0 && (
                                                    <Icon name="crown" size={18} className="text-yellow-400 animate-bounce" />
                                                )}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* BOTTOM ACTION BAR */}
                    {!showWelcome && (
                        <div className={`p-4 pb-safe flex-none border-t z-30 ${isDarkMode ? 'bg-[#2b0404]/90 border-amber-500/20' : 'bg-white border-amber-200 shadow-xl'}`}>
                            {matchOver ? (
                                <div className="text-center p-2 animate-in zoom-in-95 duration-500">
                                    <h4 className="text-xl font-serif-royal font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-yellow-200 to-amber-400 uppercase mb-2">
                                        🏆 Shubh Diwali Champion! 🏆
                                    </h4>
                                    <button onClick={startNewMatch} className="px-8 py-3.5 bg-gradient-to-r from-amber-500 to-yellow-400 text-amber-950 rounded-2xl font-serif-royal font-black uppercase text-xs shadow-lg active:scale-95 transition-all">
                                        Start New Tournament
                                    </button>
                                </div>
                            ) : (
                                <div className="flex gap-3 max-w-lg mx-auto">
                                    <button onClick={() => setUi({...ui, add: true})} className="flex-1 h-14 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-600 hover:brightness-110 text-amber-950 rounded-2xl font-serif-royal font-black uppercase tracking-wider shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2 active:scale-95 transition-all border border-yellow-200">
                                        <Icon name="plus" size={22} /> Record Hand Score
                                    </button>
                                    <button onClick={shareAsScreenshot} disabled={ui.isSharing} className={`px-5 h-14 rounded-2xl font-bold shadow-lg flex items-center justify-center transition-all active:scale-95 ${isDarkMode ? 'bg-amber-500/10 text-amber-300 border border-amber-500/30' : 'bg-amber-100 text-amber-900'} ${ui.isSharing ? 'animate-pulse' : ''}`}>
                                        {ui.isSharing ? <Icon name="loader" size={22} /> : <Icon name="camera" size={22} />}
                                    </button>
                                </div>
                            )}
                        </div>
                    )}

                    {/* FESTIVE MODALS OVERLAY SYSTEM */}
                    {(ui.add || ui.editIdx !== null || ui.settings || ui.history || ui.bust || ui.confirm) && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-in fade-in">
                            
                            {/* ADD / EDIT SCORES MODAL */}
                            {(ui.add || ui.editIdx !== null) && (
                                <div className={`w-full max-w-md rounded-3xl p-6 shadow-2xl border ${isDarkMode ? 'royal-glass-dark text-amber-100' : 'royal-glass-light text-amber-950'}`}>
                                    <div className="flex justify-between items-center mb-5">
                                        <h3 className="text-lg font-serif-royal font-black text-amber-400 uppercase flex items-center gap-2">
                                            <Icon name="diya" size={20} /> {ui.editIdx !== null ? "Edit Hand Score" : "Record Hand Score"}
                                        </h3>
                                        <button onClick={() => setUi({...ui, add: false, editIdx: null})} className="text-amber-400/60 hover:text-amber-400 p-1">
                                            <Icon name="x" size={24} />
                                        </button>
                                    </div>
                                    
                                    {form.error && (
                                        <div className="mb-4 bg-rose-500/15 border border-rose-500/30 p-3 rounded-xl text-xs font-bold text-rose-400 flex items-center gap-2">
                                            <Icon name="alert-circle" size={16} /> {form.error}
                                        </div>
                                    )}

                                    <div className="grid grid-cols-2 gap-3 mb-6 max-h-[45vh] overflow-y-auto pr-1 no-scrollbar">
                                        {players.map((p, idx) => !inactive.includes(idx) && (
                                            <div key={idx} className="flex flex-col gap-1.5">
                                                <label className="text-[10px] font-bold uppercase text-amber-400/90 truncate">{p}</label>
                                                <input 
                                                    type="number" 
                                                    inputMode="numeric" 
                                                    value={form.scores[p] !== undefined ? form.scores[p] : ''} 
                                                    onChange={e => setForm({...form, scores: {...form.scores, [p]: e.target.value}})} 
                                                    className={`w-full p-3.5 rounded-xl text-center text-2xl font-black outline-none border transition-all ${isDarkMode ? 'bg-black/40 border-amber-500/30 text-yellow-300 focus:border-amber-400' : 'bg-white border-amber-200 text-amber-950 focus:border-amber-500'}`} 
                                                    placeholder="0" 
                                                />
                                            </div>
                                        ))}
                                    </div>

                                    <button onClick={() => submitScores(ui.editIdx !== null)} className="w-full bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-600 text-amber-950 py-4 rounded-xl font-serif-royal font-black uppercase tracking-wider shadow-lg active:scale-95 transition-all">
                                        Submit Hand
                                    </button>
                                </div>
                            )}

                            {/* PLAYERS & SETTINGS MODAL */}
                            {ui.settings && (
                                <div className={`w-full max-w-sm rounded-3xl p-6 shadow-2xl border ${isDarkMode ? 'royal-glass-dark text-amber-100' : 'royal-glass-light text-amber-950'}`}>
                                    <h3 className="text-lg font-serif-royal font-black text-amber-400 uppercase mb-6 flex items-center gap-2">
                                        <Icon name="users" size={20} /> Tournament Roster
                                    </h3>
                                    
                                    <input 
                                        type="text" 
                                        value={form.name} 
                                        onChange={e => setForm({...form, name: e.target.value})} 
                                        placeholder="Enter Player Name..." 
                                        className={`w-full p-3.5 rounded-xl mb-3 font-semibold outline-none border ${isDarkMode ? 'bg-black/40 border-amber-500/30 text-yellow-300' : 'bg-white border-amber-200 text-amber-950'}`} 
                                    />
                                    
                                    <div className="grid grid-cols-2 gap-2 mb-6">
                                        <button onClick={() => { if(form.name) { setGame(g=>({...g, players: [...g.players, form.name.trim()], rounds: [], inactive: [], reEntries: new Array(g.players.length+1).fill(0)})); setForm(f=>({...f, name:''})); setUi(u=>({...u, settings: false})); }}} className="py-3 rounded-xl text-xs font-bold uppercase border border-amber-500/30 bg-amber-500/10 text-amber-300 active:scale-95 transition-all">
                                            Reset Pitch
                                        </button>
                                        <button onClick={midGameJoin} className="py-3 bg-gradient-to-r from-amber-500 to-yellow-400 text-amber-950 rounded-xl text-xs font-bold uppercase shadow-md active:scale-95 transition-all">
                                            Join @ High+1
                                        </button>
                                    </div>

                                    <div className="space-y-2 mb-6 max-h-48 overflow-y-auto pr-1 no-scrollbar">
                                        {players.map((p, i) => (
                                            <div key={i} className={`flex items-center justify-between p-3 border rounded-xl transition-all ${isDarkMode ? 'bg-black/30 border-amber-500/20' : 'bg-white/80 border-amber-200'} ${inactive.includes(i) ? 'opacity-40' : ''}`}>
                                                {form.editIdx === i ? (
                                                    <div className="flex-1 flex gap-2 min-w-0">
                                                        <input type="text" value={form.editVal} onChange={e => setForm({...form, editVal: e.target.value})} className="flex-1 bg-black/40 px-2 py-1 rounded text-xs font-bold outline-none text-yellow-300 min-w-0" autoFocus />
                                                        <button onClick={() => savePlayerNameEdit(i)} className="text-amber-400 shrink-0"><Icon name="check-circle" size={18} /></button>
                                                    </div>
                                                ) : (
                                                    <>
                                                        <span className="text-xs font-bold uppercase truncate max-w-[130px]">{p} {inactive.includes(i) && <span className="ml-1 text-[9px] text-rose-400">(OUT)</span>}</span>
                                                        <div className="flex gap-1 shrink-0">
                                                            <button onClick={() => setForm({...form, editIdx: i, editVal: p})} className="p-1.5 opacity-60 hover:opacity-100 text-amber-400"><Icon name="pencil-line" size={15}/></button>
                                                            {players.length > 2 && (
                                                                <button onClick={() => setUi({ ...ui, confirm: { msg: `Remove ${p}? Game will reset.`, fn: () => { setGame({...game, players: players.filter((_, idx) => idx !== i), rounds: [], inactive: []}); setUi({...ui, confirm: null}); } } })} className="text-rose-400 p-1.5 opacity-60 hover:opacity-100"><Icon name="user-minus" size={15}/></button>
                                                            )}
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                        ))}
                                    </div>

                                    <button onClick={() => setUi({...ui, settings: false})} className="w-full py-3.5 bg-amber-950 text-amber-300 rounded-xl font-bold uppercase text-xs border border-amber-500/30">
                                        Done
                                    </button>
                                </div>
                            )}

                            {/* HISTORY LOG MODAL */}
                            {ui.history && (
                                <div className={`w-full max-w-md rounded-3xl p-6 shadow-2xl border ${isDarkMode ? 'royal-glass-dark text-amber-100' : 'royal-glass-light text-amber-950'}`}>
                                    <h3 className="text-lg font-serif-royal font-black text-amber-400 uppercase mb-5 flex items-center gap-2">
                                        <Icon name="history" size={20} /> Match History
                                    </h3>
                                    
                                    <div className="space-y-3 max-h-[50vh] overflow-y-auto pr-1 no-scrollbar">
                                        {sessionHistory.length === 0 ? (
                                            <div className="py-16 text-center opacity-40 text-xs font-serif-royal uppercase tracking-widest font-bold">No Past Match Logs</div>
                                        ) : sessionHistory.map((log) => (
                                            <div key={log.id} className={`p-3.5 rounded-xl border ${isDarkMode ? 'bg-black/30 border-amber-500/20' : 'bg-white/90 border-amber-200'}`}>
                                                <div className="flex justify-between items-center mb-2 border-b border-amber-500/10 pb-2 text-amber-400 font-bold">
                                                    <span className="text-[10px]">{new Date(log.id).toLocaleDateString()}</span>
                                                    <button onClick={() => restoreSession(log)} className="text-[9px] bg-gradient-to-r from-amber-500 to-yellow-400 text-amber-950 px-2.5 py-1 rounded-md font-bold uppercase active:scale-90 transition-all">Restore</button>
                                                </div>
                                                <div className="grid grid-cols-2 gap-x-4 gap-y-1">
                                                    {log.players.map((pName, pIdx) => (
                                                        <div key={pIdx} className="flex items-center justify-between text-[11px] opacity-80">
                                                            <span className="truncate">{pName}</span>
                                                            <span className="font-bold tabular-nums">{log.finalScores[pIdx]}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    
                                    <button onClick={() => setUi({...ui, history: false})} className="w-full mt-6 py-3.5 bg-amber-950 text-amber-300 rounded-xl font-bold uppercase text-xs border border-amber-500/30">
                                        Close History
                                    </button>
                                </div>
                            )}

                            {/* CONFIRMATION DIALOG */}
                            {ui.confirm && (
                                <div className={`w-full max-w-xs rounded-3xl p-6 text-center shadow-2xl border animate-in zoom-in-95 ${isDarkMode ? 'royal-glass-dark text-amber-100' : 'royal-glass-light text-amber-950'}`}>
                                    <Icon name="alert-circle" size={36} className="text-amber-400 mb-3 mx-auto" />
                                    <p className="text-xs font-bold uppercase mb-6 leading-relaxed">{ui.confirm.msg}</p>
                                    <div className="flex gap-2">
                                        <button onClick={ui.confirm.fn} className="flex-1 py-3 bg-gradient-to-r from-amber-500 to-yellow-400 text-amber-950 rounded-xl text-xs font-bold uppercase">Confirm</button>
                                        <button onClick={() => setUi({...ui, confirm: null})} className="flex-1 py-3 bg-amber-950 text-amber-300 rounded-xl text-xs font-bold uppercase border border-amber-500/30">Cancel</button>
                                    </div>
                                </div>
                            )}

                            {/* BUST / RE-ENTRY MODAL */}
                            {ui.bust && (
                                <div className={`w-full max-w-sm rounded-3xl p-6 shadow-2xl border animate-in zoom-in-95 ${isDarkMode ? 'royal-glass-dark text-amber-100' : 'royal-glass-light text-amber-950'}`}>
                                    <div className="text-center mb-6">
                                        <div className="w-14 h-14 bg-rose-500/20 border border-rose-500/40 rounded-full flex items-center justify-center mx-auto mb-3 text-rose-400">
                                            <Icon name="flame" size={28}/>
                                        </div>
                                        <h3 className="text-xl font-serif-royal font-black uppercase text-rose-400 mb-2">Score Passed 200!</h3>
                                        <p className="text-xs font-bold uppercase opacity-80 leading-relaxed">
                                            {players[ui.bust.current]} has crossed 200 points limit. <br/>
                                            {(() => {
                                                const pIdx = ui.bust.current;
                                                const safeOpponents = ui.bust.proj.filter((t, idx) => 
                                                    idx !== pIdx && !inactive.includes(idx) && !ui.bust.idxs.includes(idx)
                                                );
                                                const locked = safeOpponents.length > 0 && !safeOpponents.some(t => t < 180);
                                                return locked 
                                                    ? "Re-entry Closed! Leading players are at 180+ points." 
                                                    : `Re-enter tournament at ${ui.bust.target} points (High+1)?`;
                                            })()}
                                        </p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <button 
                                            onClick={() => solveBust(true)} 
                                            disabled={(() => {
                                                const pIdx = ui.bust.current;
                                                const safeOpponents = ui.bust.proj.filter((t, idx) => 
                                                    idx !== pIdx && !inactive.includes(idx) && !ui.bust.idxs.includes(idx)
                                                );
                                                return safeOpponents.length > 0 && !safeOpponents.some(t => t < 180);
                                            })()} 
                                            className={`py-4 rounded-xl text-xs font-black uppercase shadow-lg transition-all ${(() => {
                                                const pIdx = ui.bust.current;
                                                const safeOpponents = ui.bust.proj.filter((t, idx) => 
                                                    idx !== pIdx && !inactive.includes(idx) && !ui.bust.idxs.includes(idx)
                                                );
                                                const locked = safeOpponents.length > 0 && !safeOpponents.some(t => t < 180);
                                                return locked ? 'bg-amber-950/40 text-amber-500/30 border border-amber-500/10 cursor-not-allowed' : 'bg-gradient-to-r from-amber-500 to-yellow-400 text-amber-950 active:scale-95';
                                            })()}`}
                                        >
                                            Buy-In
                                        </button>
                                        <button onClick={() => solveBust(false)} className="bg-rose-600/90 hover:bg-rose-600 text-white py-4 rounded-xl text-xs font-black uppercase active:scale-95 transition-all border border-rose-400/30">
                                            Eliminate
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
